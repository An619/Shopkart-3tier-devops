apiVersion: v1
kind: Secret
metadata:
  name: shopkart-secret
  namespace: {{ include "shopkart.namespace" . }}
  labels:
    {{- include "shopkart.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  DB_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
