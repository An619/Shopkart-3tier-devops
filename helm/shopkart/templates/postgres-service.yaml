{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: shopkart-postgres
  namespace: {{ include "shopkart.namespace" . }}
  labels:
    {{- include "shopkart.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "shopkart.selectorLabels" (dict "component" "postgres" "context" .) | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: 5432
      protocol: TCP
{{- end }}
