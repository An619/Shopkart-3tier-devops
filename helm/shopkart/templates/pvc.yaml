{{- if and .Values.postgres.enabled (not .Values.postgres.persistence.enabled) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shopkart-postgres-data
  namespace: {{ include "shopkart.namespace" . }}
  labels:
    {{- include "shopkart.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
{{- end }}
