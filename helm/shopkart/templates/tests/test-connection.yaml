apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-connection"
  namespace: {{ include "shopkart.namespace" . }}
  labels:
    {{- include "shopkart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl-backend
      image: curlimages/curl:8.10.1
      command: ["sh", "-c"]
      args:
        - |
          set -e
          echo "Testing backend health endpoint..."
          curl -fsS http://shopkart-backend:{{ .Values.backend.service.port }}/api/health
          echo ""
          echo "Testing frontend health..."
          curl -fsS http://shopkart-frontend:{{ .Values.frontend.service.port }}/healthz
          echo ""
          echo "All tests passed."
