apiVersion: v1
kind: ConfigMap
metadata:
  name: shopkart-config
  namespace: {{ include "shopkart.namespace" . }}
  labels:
    {{- include "shopkart.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.backend.env.NODE_ENV | quote }}
  PORT: {{ .Values.backend.env.PORT | quote }}
  HOST: {{ .Values.backend.env.HOST | quote }}
  DB_HOST: {{ .Values.backend.env.DB_HOST | quote }}
  DB_PORT: {{ .Values.backend.env.DB_PORT | quote }}
  DB_NAME: {{ .Values.postgres.auth.database | quote }}
  DB_USER: {{ .Values.postgres.auth.username | quote }}
  DB_POOL_MAX: {{ .Values.backend.env.DB_POOL_MAX | quote }}
  JWT_EXPIRES_IN: {{ .Values.backend.env.JWT_EXPIRES_IN | quote }}
  BCRYPT_SALT_ROUNDS: {{ .Values.backend.env.BCRYPT_SALT_ROUNDS | quote }}
  CORS_ORIGIN: {{ .Values.backend.env.CORS_ORIGIN | quote }}
  BACKEND_URL: {{ .Values.frontend.env.BACKEND_URL | quote }}
  BACKEND_URL_METRICS: {{ .Values.frontend.env.BACKEND_URL_METRICS | quote }}
