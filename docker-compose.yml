# ============================================================
# ShopKart — Docker Compose (production-like local stack)
# ============================================================
# Services: postgres → backend → frontend
# Start:    docker compose up -d
# Stop:     docker compose down
# Wipe DB:  docker compose down -v
# ============================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: shopkart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopkart}
      POSTGRES_USER: ${POSTGRES_USER:-shopkart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopkart_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopkart_user} -d ${POSTGRES_DB:-shopkart}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shopkart-net

  backend:
    image: ${BACKEND_IMAGE:-shopkart-backend}:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopkart-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-shopkart}
      DB_USER: ${POSTGRES_USER:-shopkart_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shopkart_pass}
      DB_POOL_MAX: 10
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_secret_min_32_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - shopkart-net

  frontend:
    image: ${FRONTEND_IMAGE:-shopkart-frontend}:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopkart-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
      BACKEND_URL_METRICS: http://backend:5000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - shopkart-net

volumes:
  postgres_data:
    driver: local

networks:
  shopkart-net:
    driver: bridge
