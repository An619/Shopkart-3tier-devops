# ============================================================
# ShopKart — Docker Compose dev overrides
# ============================================================
# Automatically merged with docker-compose.yml by Compose.
# Adds bind mounts and dev-specific settings.
# Do NOT commit this file if you customize it for personal use.
# ============================================================

services:
  backend:
    build:
      target: deps
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/tests:/app/tests:ro
    # Dev: no healthcheck wait — faster iteration
    depends_on:
      postgres:
        condition: service_started
