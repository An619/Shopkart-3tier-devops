server {
  listen 80;
  server_name _;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location /api/auth/ { proxy_pass http://identity-service:5000/api/auth/; include /etc/nginx/proxy_params; }
  location /api/users/ { proxy_pass http://identity-service:5000/api/users/; include /etc/nginx/proxy_params; }
  location /api/products { proxy_pass http://catalog-service:5000/api/products; include /etc/nginx/proxy_params; }
  location /api/categories { proxy_pass http://catalog-service:5000/api/categories; include /etc/nginx/proxy_params; }
  location /api/reviews { proxy_pass http://catalog-service:5000/api/reviews; include /etc/nginx/proxy_params; }
  location /api/cart { proxy_pass http://cart-service:5000/api/cart; include /etc/nginx/proxy_params; }
  location /api/wishlist { proxy_pass http://wishlist-service:5000/api/wishlist; include /etc/nginx/proxy_params; }
  location /api/orders { proxy_pass http://orders-service:5000/api/orders; include /etc/nginx/proxy_params; }
  location /api/admin { proxy_pass http://admin-service:5000/api/admin; include /etc/nginx/proxy_params; }
  location /api/health { proxy_pass http://identity-service:5000/api/health; }
  location / { return 404; }
}
