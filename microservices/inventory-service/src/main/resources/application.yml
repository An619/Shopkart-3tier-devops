server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: inventory-service
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
info:
  app:
    name: inventory-service
    version: 1.0.0