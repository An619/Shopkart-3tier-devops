server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: inventory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopkart_inventory}
    username: ${SPRING_DATASOURCE_USERNAME:shopkart}
    password: ${SPRING_DATASOURCE_PASSWORD:shopkart_local_only}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
info:
  app:
    name: inventory-service
    version: 1.0.0
