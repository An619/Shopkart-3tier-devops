# ShopKart domain-service stack. All services currently share the legacy PostgreSQL
# schema to preserve existing data/API behavior during extraction. Database ownership
# is the next migration step; do not describe this shared-DB phase as final production architecture.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopkart}
      POSTGRES_USER: ${POSTGRES_USER:-shopkart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell/.env}
    volumes:
      - shopkart_domain_pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopkart_user} -d ${POSTGRES_DB:-shopkart}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [shopkart]

  identity-service: &domain
    build: { context: ../backend, dockerfile: Dockerfile }
    image: ${BACKEND_IMAGE:-shopkart-backend}:${IMAGE_TAG:-local}
    environment: &backend-env
      NODE_ENV: production
      PORT: "5000"
      SERVICE_NAME: identity
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-shopkart}
      DB_USER: ${POSTGRES_USER:-shopkart_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres: { condition: service_healthy }
    expose: ["5000"]
    restart: unless-stopped
    networks: [shopkart]

  catalog-service:
    <<: *domain
    environment:
      <<: *backend-env
      SERVICE_NAME: catalog

  cart-service:
    <<: *domain
    environment:
      <<: *backend-env
      SERVICE_NAME: cart

  wishlist-service:
    <<: *domain
    environment:
      <<: *backend-env
      SERVICE_NAME: wishlist

  orders-service:
    <<: *domain
    environment:
      <<: *backend-env
      SERVICE_NAME: orders

  admin-service:
    <<: *domain
    environment:
      <<: *backend-env
      SERVICE_NAME: admin

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/domain-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - identity-service
      - catalog-service
      - cart-service
      - wishlist-service
      - orders-service
      - admin-service
    restart: unless-stopped
    networks: [shopkart]

  frontend:
    build: { context: ../frontend, dockerfile: Dockerfile }
    image: ${FRONTEND_IMAGE:-shopkart-frontend}:${IMAGE_TAG:-local}
    environment:
      BACKEND_URL: http://gateway:80
      BACKEND_URL_METRICS: http://identity-service:5000
    ports: ["${FRONTEND_PORT:-8080}:80"]
    depends_on: [gateway]
    restart: unless-stopped
    networks: [shopkart]

volumes:
  shopkart_domain_pgdata:

networks:
  shopkart:
    driver: bridge
