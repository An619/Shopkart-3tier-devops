# ShopKart domain-service stack. The default Catalog runtime stays on the legacy DB
# until read/write parity and Inventory ownership are proven. The opt-in profile below
# exercises Catalog against its own database without changing gateway traffic.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopkart}
      POSTGRES_USER: ${POSTGRES_USER:-shopkart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell/.env}
    volumes:
      - shopkart_domain_pgdata:/var/lib/postgresql/data
      - ../microservices/postgres/init/01-databases.sql:/docker-entrypoint-initdb.d/00-databases.sql:ro
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopkart_user} -d ${POSTGRES_DB:-shopkart}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [shopkart]

  identity-service: &domain
    build: { context: ../backend, dockerfile: Dockerfile }
    image: ${BACKEND_IMAGE:-shopkart-backend}:${IMAGE_TAG:-local}
    environment: &backend-env
      NODE_ENV: production
      PORT: "5000"
      SERVICE_NAME: identity
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-shopkart}
      DB_USER: ${POSTGRES_USER:-shopkart_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres: { condition: service_healthy }
    expose: ["5000"]
    restart: unless-stopped
    networks: [shopkart]

  catalog-service:
    <<: *domain
    environment:
      <<: *backend-env
      SERVICE_NAME: catalog

  # Opt-in shadow runtime. Backfill data before querying it. It is intentionally
  # not a gateway dependency and receives no production traffic until cutover gates pass.
  catalog-extracted-service:
    <<: *domain
    profiles: ["catalog-extraction"]
    environment:
      <<: *backend-env
      SERVICE_NAME: catalog
      DB_NAME: shopkart_catalog
      CATALOG_AUTHOR_SNAPSHOT: "true"
      SOURCE_DB_HOST: postgres
      SOURCE_DB_PORT: "5432"
      SOURCE_DB_NAME: ${POSTGRES_DB:-shopkart}
      SOURCE_DB_USER: ${POSTGRES_USER:-shopkart_user}
      SOURCE_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell/.env}
      CATALOG_DB_HOST: postgres
      CATALOG_DB_PORT: "5432"
      CATALOG_DB_NAME: shopkart_catalog
      CATALOG_DB_USER: ${POSTGRES_USER:-shopkart_user}
      CATALOG_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell/.env}
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ../database/catalog/schema.sql:/database/catalog/schema.sql:ro
    expose: ["5000"]

  cart-service:
    <<: *domain
    environment:
      <<: *backend-env
      SERVICE_NAME: cart

  wishlist-service:
    <<: *domain
    environment:
      <<: *backend-env
      SERVICE_NAME: wishlist

  orders-service:
    <<: *domain
    environment:
      <<: *backend-env
      SERVICE_NAME: orders

  admin-service:
    <<: *domain
    environment:
      <<: *backend-env
      SERVICE_NAME: admin

  product-service:
    build: { context: ., dockerfile: product-service/Dockerfile }
    image: ${PRODUCT_IMAGE:-shopkart-product-service}:${IMAGE_TAG:-local}
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart_products
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shopkart_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell/.env}
    depends_on:
      postgres: { condition: service_healthy }
    expose: ["8081"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks: [shopkart]

  inventory-service:
    build: { context: ., dockerfile: inventory-service/Dockerfile }
    image: ${INVENTORY_IMAGE:-shopkart-inventory-service}:${IMAGE_TAG:-local}
    environment:
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart_inventory
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shopkart_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell/.env}
    depends_on:
      postgres: { condition: service_healthy }
    expose: ["8083"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8083/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks: [shopkart]

  order-service:
    build: { context: ., dockerfile: order-service/Dockerfile }
    image: ${ORDER_IMAGE:-shopkart-order-service}:${IMAGE_TAG:-local}
    environment:
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart_orders
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shopkart_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell/.env}
      SHOPKART_INVENTORY_BASE_URL: http://inventory-service:8083
    depends_on:
      postgres: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
    expose: ["8082"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks: [shopkart]

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/domain-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      identity-service: { condition: service_started }
      catalog-service: { condition: service_started }
      cart-service: { condition: service_started }
      wishlist-service: { condition: service_started }
      orders-service: { condition: service_started }
      admin-service: { condition: service_started }
      product-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
    restart: unless-stopped
    networks: [shopkart]

  frontend:
    build: { context: ../frontend, dockerfile: Dockerfile }
    image: ${FRONTEND_IMAGE:-shopkart-frontend}:${IMAGE_TAG:-local}
    environment:
      BACKEND_URL: http://gateway:80
      BACKEND_URL_METRICS: http://identity-service:5000
    ports: ["${FRONTEND_PORT:-8080}:80"]
    depends_on: [gateway]
    restart: unless-stopped
    networks: [shopkart]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - shopkart_prometheus_data:/prometheus
    ports: ["9090:9090"]
    depends_on:
      product-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
    restart: unless-stopped
    networks: [shopkart]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your shell/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - shopkart_grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [shopkart]

volumes:
  shopkart_domain_pgdata:
  shopkart_prometheus_data:
  shopkart_grafana_data:

networks:
  shopkart:
    driver: bridge
