services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: shopkart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopkart_local_only}
    ports: ["5434:5432"]
    volumes:
      - shopkart_microservices_pgdata:/var/lib/postgresql/data
      - ./postgres/init/01-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopkart -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  product-service:
    build: { context: ., dockerfile: product-service/Dockerfile }
    image: shopkart-product-service:local
    ports: ["8081:8081"]
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart_products
      SPRING_DATASOURCE_USERNAME: shopkart
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shopkart_local_only}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 35s
    restart: unless-stopped

  order-service:
    build: { context: ., dockerfile: order-service/Dockerfile }
    image: shopkart-order-service:local
    ports: ["8082:8082"]
    environment:
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart_orders
      SPRING_DATASOURCE_USERNAME: shopkart
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shopkart_local_only}
      SHOPKART_INVENTORY_BASE_URL: http://inventory-service:8083
    depends_on:
      postgres: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 35s
    restart: unless-stopped

  inventory-service:
    build: { context: ., dockerfile: inventory-service/Dockerfile }
    image: shopkart-inventory-service:local
    ports: ["8083:8083"]
    environment:
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart_inventory
      SPRING_DATASOURCE_USERNAME: shopkart
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shopkart_local_only}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8083/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 35s
    restart: unless-stopped

volumes:
  shopkart_microservices_pgdata:
