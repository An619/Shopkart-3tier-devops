services:
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    image: shopkart-product-service:local
    ports: ["8081:8081"]
    environment: { SERVER_PORT: "8081" }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 35s
    restart: unless-stopped
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: shopkart-order-service:local
    ports: ["8082:8082"]
    environment: { SERVER_PORT: "8082" }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 35s
    restart: unless-stopped
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    image: shopkart-inventory-service:local
    ports: ["8083:8083"]
    environment: { SERVER_PORT: "8083" }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8083/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 35s
    restart: unless-stopped
