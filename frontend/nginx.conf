# ============================================================
# ShopKart — Frontend Nginx config
# ============================================================
# 1. Serves the built React SPA (dist/) with SPA fallback
# 2. Proxies /api/* to the backend service
# 3. Exposes /healthz for Kubernetes probes
# ============================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---------- Security headers ----------
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ---------- Gzip ----------
    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml
                      application/xml+rss text/javascript image/svg+xml;

    # ---------- Nginx healthcheck (used by K8s probes) ----------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------- API proxy to backend ----------
    # BACKEND_URL is injected via envsubst at container start (see Dockerfile).
    location /api/ {
        proxy_pass         ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---------- Prometheus metrics from backend ----------
    location /metrics {
        proxy_pass         ${BACKEND_URL_METRICS};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ---------- Static assets with long cache ----------
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
