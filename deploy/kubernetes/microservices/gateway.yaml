apiVersion: v1
kind: ConfigMap
metadata:
  name: shopkart-gateway-nginx
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      location = /healthz { access_log off; return 200 "ok\n"; }
      location /api/products {
        proxy_pass http://product-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location /api/orders {
        proxy_pass http://order-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location /api/inventory {
        proxy_pass http://inventory-service:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      # Strangler migration: routes not migrated yet are temporarily handled by the existing backend.
      location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopkart-gateway
  labels:
    app.kubernetes.io/name: shopkart-gateway
    app.kubernetes.io/part-of: shopkart
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shopkart-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopkart-gateway
        app.kubernetes.io/part-of: shopkart
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          command: ["nginx", "-g", "daemon off;"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: config
          configMap:
            name: shopkart-gateway-nginx
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shopkart-gateway
spec:
  selector:
    app.kubernetes.io/name: shopkart-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
