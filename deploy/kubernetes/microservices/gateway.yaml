apiVersion: v1
kind: ConfigMap
metadata:
  name: shopkart-gateway-nginx
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      location = /healthz { access_log off; default_type text/plain; return 200 "ok\\n"; }
      location /api/auth { proxy_pass http://identity-service:5000; include /etc/nginx/proxy_params; }
      location /api/users { proxy_pass http://identity-service:5000; include /etc/nginx/proxy_params; }
      location /api/products { proxy_pass http://catalog-service:5000; include /etc/nginx/proxy_params; }
      location /api/categories { proxy_pass http://catalog-service:5000; include /etc/nginx/proxy_params; }
      location /api/reviews { proxy_pass http://catalog-service:5000; include /etc/nginx/proxy_params; }
      location /api/cart { proxy_pass http://cart-service:5000; include /etc/nginx/proxy_params; }
      location /api/wishlist { proxy_pass http://wishlist-service:5000; include /etc/nginx/proxy_params; }
      location /api/orders { proxy_pass http://orders-service:5000; include /etc/nginx/proxy_params; }
      location /api/admin { proxy_pass http://admin-service:5000; include /etc/nginx/proxy_params; }
      location = /api/health { proxy_pass http://identity-service:5000/api/health; }
      location /api/ { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopkart-gateway
  labels:
    app.kubernetes.io/name: shopkart-gateway
    app.kubernetes.io/part-of: shopkart
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shopkart-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopkart-gateway
        app.kubernetes.io/part-of: shopkart
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: config
          configMap:
            name: shopkart-gateway-nginx
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shopkart-gateway
spec:
  selector:
    app.kubernetes.io/name: shopkart-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
