apiVersion: v1
kind: Secret
metadata:
  name: shopkart-legacy-database
type: Opaque
stringData:
  POSTGRES_USER: shopkart_user
  POSTGRES_PASSWORD: replace-before-deploy
  JWT_SECRET: replace-with-a-random-secret-at-least-32-characters
---
apiVersion: v1
kind: Service
metadata:
  name: shopkart-legacy-postgres
spec:
  selector:
    app.kubernetes.io/name: shopkart-legacy-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shopkart-legacy-postgres
spec:
  serviceName: shopkart-legacy-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shopkart-legacy-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopkart-legacy-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: shopkart
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shopkart-legacy-database
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopkart-legacy-database
                  key: POSTGRES_PASSWORD
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/01-schema.sql
              subPath: legacy-schema.sql
              readOnly: true
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/02-seed.sql
              subPath: legacy-seed.sql
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d shopkart"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: schema
          configMap:
            name: shopkart-legacy-schema
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
