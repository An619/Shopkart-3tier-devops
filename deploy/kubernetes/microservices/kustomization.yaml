apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shopkart-microservices
resources:
  - postgres.yaml
  - legacy-postgres.yaml
  - domain-services.yaml
  - gateway.yaml
  - product-service.yaml
  - order-service.yaml
  - inventory-service.yaml
  - network-policy.yaml
configMapGenerator:
  - name: shopkart-legacy-schema
    files:
      - legacy-schema.sql=sql/legacy-schema.sql
      - legacy-seed.sql=sql/legacy-seed.sql
generatorOptions:
  disableNameSuffixHash: true
