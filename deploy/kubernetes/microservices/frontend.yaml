apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopkart-frontend
  labels:
    app.kubernetes.io/name: shopkart-frontend
    app.kubernetes.io/part-of: shopkart
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shopkart-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopkart-frontend
        app.kubernetes.io/part-of: shopkart
    spec:
      containers:
        - name: frontend
          image: YOUR_DOCKERHUB_USERNAME/shopkart-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: BACKEND_URL
              value: http://shopkart-gateway:8080
            - name: BACKEND_URL_METRICS
              value: http://identity-service:5000
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: shopkart-frontend
spec:
  selector:
    app.kubernetes.io/name: shopkart-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
