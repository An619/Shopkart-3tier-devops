jenkins:
  systemMessage: "ShopKart CI — managed by Configuration as Code"
  numExecutors: 2
  mode: NORMAL
  scmCheckoutRetryCount: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"
    adminAddress: "admin@shopkart.dev"
  timestamper:
    allPipelines: true

tool:
  git:
    installations:
      - name: "Default"
        home: "git"
